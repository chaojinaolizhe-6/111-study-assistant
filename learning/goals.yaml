  - id: ode-systems-const-coeff
    title: 独立求解常系数线性系统 Y′ = AY（微分方程·方程组章）
    subject: 03-微分方程
    targets:
      - ode.sys.eigen-basic
      - ode.sys.case-complex
      - ode.sys.case-repeated
      - ode.sys.ivp
    acceptance:
      - 能由 det(A − λE) = 0 求全部特征值与代数重数，并对每个 λ 解 (A − λE)V = 0 得特征向量
      - 能算出几何重数 g = n − rank(A − λE) 并据此判断走哪个分支
      - 复根情形能由 Ve^(λx) 取实部/虚部得到两个实值解
      - 重根且 g < m 时能补广义特征向量链 (A − λE)V_{k+1} = V_k，并写成多项式乘 e^(λx) 的形式
      - 给初值 Y(x₀) = Y₀ 能解出常数 c₁…cₙ
    deadline: null
    milestone: 2026-11-09    # 四周能力里程碑（2026-10-12 起）
    status: active
    note: 2026-10-12 建立（HW Lecture 14–15，due 2026-10-18；方程组章**不在 10-20 期中范围**）。课件 `14_15_Linear-DE-systems-with-constant-coefficients.pdf`（64 页，Case 1/2/3a/3b）；讲义 `subjects/03-微分方程/讲义/方程组章-精讲-20261008.md`。首次作答（2026-10-12）：特征方程/特征值/特征向量、复根情形全对；**重根情形漏了广义特征向量**（写成 x·Ve^{λx}，代入不是解）→ 见 `attempt-48`。

