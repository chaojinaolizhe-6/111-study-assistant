  - id: ielts-english-75
    title: 雅思训练：听力 8.0 / 口语 7.0 / 写作冲高（均分 7.5 通路）
    subject: 11-英语-雅思
    targets:
      - en.listen.decoding       # 听觉识别/解码；短段诊断按需，不用95%当IELTS8指标
      - en.listen.structure      # 一遍后复述论证结构与说话人态度
      - en.read.timed            # 目标8；现有雅思阅读水平未测
      - en.write.tr              # Task Response / Task Achievement
      - en.write.cc              # Coherence and Cohesion
      - en.write.lr              # Lexical Resource
      - en.write.gra             # Grammatical Range and Accuracy
      - en.speak.fc              # Fluency and Coherence
      - en.speak.lr              # Lexical Resource
      - en.speak.gra             # Grammatical Range and Accuracy
      - en.speak.pr              # Pronunciation（**导师无音频输入，须外部评分证据**）
    acceptance:
      - 听力：完整可靠IELTS套题在对应规则下稳定达到目标8；短段理解/听写用于诊断，不以95%替代官方答题成绩
      - 阅读：限时 60 分钟完整一套，正确率对应 8 档（检查点测）
      - 写作：换新题、限时、闭卷、无帮助条件下，TR/CC/LR/GRA 四项稳定 ≥6.5 并向 7.0 推进
      - 口语：换新题、限时、闭卷、无帮助条件下，FC/LR/GRA 稳定 ≥7.0；PR 用外部评分证据
      - 正式完整产出才按适用维度记录参考分档，训练如实记录局部进展；错因仅据证据，不从文本diff编造百分比
    deadline: null             # 无考试日期：以"达到门槛才报名"替代倒计时（门槛见训练计划 §5）
    milestone: null            # 2026-10-04取消导师自设的四周强制节点，按实际进展检查
    status: active
    note: >-
      2026-10-02 建立。学习者现大二，考试不着急，可在大三中期或末期考，以训练水平为主、不赶进度；
      学期每周 5 小时、假期可加量（约 15–20h/周）；口语目标 7，写作"能高就高"（兴趣驱动：喜欢用英语与 AI 交流），
      听力以 8 为方向；外部发音/写作反馈由学习者自寻线上资源。计划与原理见 subjects/11-英语-雅思/。
      ⚠ 导师无音频输入 → `en.speak.pr` 在接入外部评分前只能记"未测"，**不得由逐字转写推断发音**。
      ⚠ 对话/示例可作训练；提示与本题曝光按实际记录，不因普通互动或通用方法学习自动捏造帮助；不凭文字聊天宣称完整口语水平。
      ⚠ 均分算术：8.0+8.0+6.5+7.0 = 29.5 → 7.5；仅当其余实际科目也达到该组合时总分为7.5，不由写作一项锁定总分，写作上限由兴趣决定。

