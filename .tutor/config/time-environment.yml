# 时间环境（时区与"学习日"边界）

> 2026-09-27 学习者指出：**系统时间是英国时间，学习者的真实本地时间是中国大陆时间**。
> 客户端元数据也印证了这点：`clientTimeZone: Europe/London`。

## 事实

| 项 | 值 |
|---|---|
| 系统/文件时间戳 | **英国时间**（Europe/London） |
| 学习者本地时间 | **中国大陆（UTC+8）** |
| 当前差值 | **+7 小时**（英国夏令时 BST=UTC+1 期间；冬令时 GMT=UTC+0 时差 **+8**） |
| 换算实例 | 系统 2026-09-27 16:04（周日）＝ 中国 2026-09-27 23:04（周日） |

换算命令（PowerShell，实测可用）：

```powershell
$now = Get-Date
$cn = [System.TimeZoneInfo]::FindSystemTimeZoneById('China Standard Time')
[System.TimeZoneInfo]::ConvertTimeFromUtc($now.ToUniversalTime(), $cn)
```

## 规则（必须遵守）

1. **一切"今天/明天/截止日/时间窗"按中国大陆时间判定**，不用系统时间直接下结论。
2. **文件名与日期标签用中国日期**：`plan/today-YYYY-MM-DD.md`、`plan/inputs.yml` 的 `today`、STATUS 的日期。
3. **跨午夜风险**：英国时间 17:00 之后，中国已进入次日 → 此时若直接用系统日期，会把"明天"写成"今天"。
   凡是接近午夜的操作，先跑上面的换算再落笔。
4. 由于差值随夏令时变化，**不写死 +7/+8**，一律用上面的时区换算命令。
5. 学习者口述的时间（"学到 13:00""明早补"）**默认按中国时间理解**；有歧义就问，不自行换算成英国时间。
